server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:bazi;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: "dev-secret-change-me-0123456789abcdef0123456789abcdef"
    expire-hours: 720
