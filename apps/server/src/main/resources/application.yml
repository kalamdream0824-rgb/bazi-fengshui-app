spring:
  profiles:
    default: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-secret-change-me-0123456789abcdef0123456789abcdef}
    expire-hours: ${APP_JWT_EXPIRE_HOURS:720}
  security:
    login:
      max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5}
      lock-minutes: ${APP_LOGIN_LOCK_MINUTES:5}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
