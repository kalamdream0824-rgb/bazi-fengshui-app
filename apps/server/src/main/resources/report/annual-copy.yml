# 年度规则只在 Java 中声明事实条件；可读内容集中在此处维护。
copy.overall.plain: "把这一年看成生活节奏与资源分配的综合提示，先看能做什么，再看哪里需要收住。"
copy.overall.professional: "结合旺衰承载、流年十神功能组及岁运支关系，评估年度主轴与风险边界。"
copy.career.plain: "重点说明工作里更可能出现的任务、位置和协作变化，并给出可执行的应对。"
copy.career.professional: "以流年十神功能、原局职业资源及岁运关系，判断职责、表达、交付与转换窗口。"
copy.wealth.plain: "重点看赚钱方式、现金安排与合同风险，不把机会直接等同于实际收入。"
copy.wealth.professional: "以财星承载、食伤转化、比劫竞争及官杀约束，分析现金流与资产动作边界。"
copy.relationship.plain: "重点看互动机会、沟通方式和边界压力，不把趋势写成必然发生的事件。"
copy.relationship.professional: "结合配偶星、日支及岁运关系，分析关系激活、互动质量与边界议题。"

assessment.insufficient.headline: "现有证据不足，先观察再判断"
assessment.insufficient.conclusion: "当前未形成两项以上相互独立的规则证据，不宜给出强结论。"
assessment.insufficient.action: "保留当年关键事件记录，出现连续信号后再调整计划。"
assessment.insufficient.signal: "同类变化在不同场景重复出现，而不是一次偶发现象。"

overall.restore_support.headline: "先补状态，再扩大行动"
overall.restore_support.conclusion: "支持性资源增加，但承载仍需恢复，稳住基本盘比抢速度更重要。"
overall.restore_support.action: "先修复作息、能力或协作短板，再增加年度目标。"
overall.restore_support.signal: "可调用的帮助增加，执行疲劳却仍然明显。"
overall.express_advance.headline: "表达与输出进入前台"
overall.express_advance.conclusion: "自身承载允许把能力向外呈现，适合用成果推动整体进展。"
overall.express_advance.action: "选择一个可公开验证的成果作为年度主线。"
overall.express_advance.signal: "展示、沟通、创作或交付任务明显增多。"
overall.resource_stewardship.headline: "资源增加，更考验分配"
overall.resource_stewardship.conclusion: "可支配事项变多，年度质量取决于取舍与兑现，而非占有数量。"
overall.resource_stewardship.action: "为时间、资金和人情分别设置上限。"
overall.resource_stewardship.signal: "机会与支出同时增多，需要频繁做取舍。"
overall.responsibility_capacity.headline: "责任上升，宜稳步承接"
overall.responsibility_capacity.conclusion: "规则和责任感增强，已有承载基础，但仍需明确边界。"
overall.responsibility_capacity.action: "只承接权责清楚且资源匹配的任务。"
overall.responsibility_capacity.signal: "审批、考核或需要你负责到底的事项增多。"
overall.load_pressure.headline: "外部要求可能超过当前负荷"
overall.load_pressure.conclusion: "责任或资源议题加重，而命局承载偏弱，需警惕透支。"
overall.load_pressure.action: "减少并行目标，为关键事项预留缓冲。"
overall.load_pressure.signal: "截止时间密集，恢复速度跟不上任务增长。"
overall.coordination.headline: "借协作整合年度资源"
overall.coordination.conclusion: "岁运形成配合，资源与行动更适合通过协同方式落地。"
overall.coordination.action: "明确一项最值得借力推进的年度目标。"
overall.coordination.signal: "他人支持、合作邀请或资源衔接变得顺畅。"
overall.transition.headline: "年度节奏进入调整点"
overall.transition.conclusion: "流年与岁运形成扰动，原有安排更容易需要调整。"
overall.transition.action: "提前准备备选路径，不把单一计划押满。"
overall.transition.signal: "岗位、居住、合作或节奏出现连续调整。"

career.role_transition.headline: "工作角色进入调整窗口"
career.role_transition.conclusion: "岁运关系出现摩擦，职责与协作方式可能先变，再带动位置变化。"
career.role_transition.action: "先确认新旧职责边界，再决定是否扩大承诺。"
career.role_transition.signal: "汇报对象、岗位范围或团队分工开始反复调整。"
career.coordination_window.headline: "协作顺畅度成为推进器"
career.coordination_window.conclusion: "岁运形成配合，资源类任务更适合通过联动推进。"
career.coordination_window.action: "把关键目标拆成明确的协作节点和交付人。"
career.coordination_window.signal: "跨团队配合、客户资源或内部支持明显增加。"
career.responsibility_upgrade.headline: "职责升级比曝光更重要"
career.responsibility_upgrade.conclusion: "责任功能走强且具备承载条件，适合争取清晰的权限与位置。"
career.responsibility_upgrade.action: "用可量化结果换取正式权限，而非只增加工作量。"
career.responsibility_upgrade.signal: "开始接触考核、管理、审批或关键决策。"
career.visibility.headline: "成果更容易被看见"
career.visibility.conclusion: "表达与产出功能增强，已有能力适合转化为可见成果。"
career.visibility.action: "固定节奏展示成果，并保留量化证据。"
career.visibility.signal: "演示、提案、发布或对外沟通机会增多。"
career.preparation.headline: "先积累下一步的筹码"
career.preparation.conclusion: "当前更适合学习与整合资源，为后续输出或职责变化做准备。"
career.preparation.action: "补齐一个直接影响下一阶段的技能或资格。"
career.preparation.signal: "培训、研究、内部储备或幕后任务增多。"
career.resource_delivery.headline: "资源要靠交付才能兑现"
career.resource_delivery.conclusion: "工作资源出现，已有输出基础决定它能否转成实际进展。"
career.resource_delivery.action: "优先完成能直接证明价值的核心交付。"
career.resource_delivery.signal: "预算、客户或项目机会增加，同时要求更快兑现。"
career.overextension.headline: "任务扩张快于承载"
career.overextension.conclusion: "输出或资源任务叠加关系扰动，容易出现忙而不精。"
career.overextension.action: "砍掉低价值并行任务，给核心交付留出复核时间。"
career.overextension.signal: "返工、临时插单与跨职责救火同时增多。"

wealth.realization.headline: "收入机会需要主动承接"
wealth.realization.conclusion: "财富功能走强且具备承载基础，适合推动可核算的收入项目。"
wealth.realization.action: "把机会换算成报价、成本、回款节点和退出条件。"
wealth.realization.signal: "订单、报价、回款或可变现资源明显增加。"
wealth.monetization.headline: "能力有转成收入的窗口"
wealth.monetization.conclusion: "输出功能增强且原局具备财富通道，可测试新的变现方式。"
wealth.monetization.action: "先用小规模产品验证付费意愿，再追加投入。"
wealth.monetization.signal: "内容、技能或渠道开始收到明确询价。"
wealth.cash_pressure.headline: "进出金额都可能放大"
wealth.cash_pressure.conclusion: "财富议题增强但承载偏弱，收入机会不等于可留存现金。"
wealth.cash_pressure.action: "先设现金安全线，再决定投资与大额支出。"
wealth.cash_pressure.signal: "回款延迟、预算超支或人情支出连续出现。"
wealth.competition.headline: "收益分配更考验规则"
wealth.competition.conclusion: "竞争与同类力量增强，现有财富资源容易出现分摊或争夺。"
wealth.competition.action: "合作前写清分成、成本和终止条件。"
wealth.competition.signal: "同业竞争、合伙分歧或共同支出增多。"
wealth.contract_caution.headline: "合同与回款要留缓冲"
wealth.contract_caution.conclusion: "关系冲动叠加财富议题，金额与履约节奏容易变化。"
wealth.contract_caution.action: "采用分段交付、分段回款并保留违约处理条款。"
wealth.contract_caution.signal: "需求反复、付款条件改变或口头承诺增多。"
wealth.compliance.headline: "先守规则，再谈收益"
wealth.compliance.conclusion: "责任约束增强，财富动作更受流程、税务或合规条件影响。"
wealth.compliance.action: "重大交易先核对合同、票据和监管要求。"
wealth.compliance.signal: "审查、审批、税务或资质问题明显增多。"
wealth.coordination.headline: "合作资源有利于增收"
wealth.coordination.conclusion: "岁运配合且财富功能活跃，可借协作提升成交效率。"
wealth.coordination.action: "优先选择权责和结算透明的合作。"
wealth.coordination.signal: "转介绍、联合项目或渠道合作开始带来有效线索。"

relationship.activation.spouse_star.headline: "关系议题的关注度上升"
relationship.activation.spouse_star.conclusion: "对应的关系功能被流年激活，更容易关注互动质量与长期匹配。"
relationship.activation.spouse_star.action: "用持续互动判断匹配度，不因短期热度过快承诺。"
relationship.activation.spouse_star.signal: "主动认识、被介绍或讨论关系安排的频率增加。"
relationship.cooperation.headline: "互动更容易形成默契"
relationship.cooperation.conclusion: "流年与日支形成配合，沟通与共同安排更容易推进。"
relationship.cooperation.action: "通过共同完成一件小事检验配合质量。"
relationship.cooperation.signal: "双方更愿意协商时间、计划与现实分工。"
relationship.boundary.headline: "关系边界需要重新确认"
relationship.boundary.conclusion: "流年直接触动日支，互动中的差异与旧问题更容易浮现。"
relationship.boundary.action: "把需求、底线和可协商范围一次说清。"
relationship.boundary.signal: "同一矛盾反复出现，回避后仍会再次触发。"
relationship.communication.headline: "沟通方式可以改善关系质量"
relationship.communication.conclusion: "理解或表达功能增强，适合处理过去说不清的问题。"
relationship.communication.action: "用事实、感受和请求三步表达，减少猜测。"
relationship.communication.signal: "深度交流、澄清误会或重新联系的机会增多。"
relationship.pace.headline: "关系推进不宜被外部节奏带着走"
relationship.pace.conclusion: "关系功能增强但岁运节奏有扰动，需要留出观察时间。"
relationship.pace.action: "重要决定至少经过一次现实场景验证。"
relationship.pace.signal: "互动升温很快，同时工作或生活安排频繁变化。"
relationship.context_support.headline: "外部条件有助于互动"
relationship.context_support.conclusion: "流年与命局形成配合，见面、协作或共同安排更顺手。"
relationship.context_support.action: "增加稳定且低压力的相处场景。"
relationship.context_support.signal: "时间安排、共同圈层或现实距离更容易协调。"
relationship.context_pressure.headline: "外部变化会放大关系压力"
relationship.context_pressure.conclusion: "流年与命局出现扰动，现实节奏可能影响互动稳定性。"
relationship.context_pressure.action: "先处理现实变量，再讨论关系本身的对错。"
relationship.context_pressure.signal: "工作、家庭或距离变化持续挤压相处时间。"
