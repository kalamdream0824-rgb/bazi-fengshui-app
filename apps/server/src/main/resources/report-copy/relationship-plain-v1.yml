# 感情通俗版 v1。三种现实状态分别写作，不用称谓替换生成。

# 单身或尚未确定关系
single.thesis: "未来三年重点看谁值得继续了解，以及什么时候不必急着确定关系。"
single.summary.with_risk: "主要看{primary}，也要顾到{secondary}；遇到{risk}时，不要急着确定关系。"
single.summary.without_risk: "主要看{primary}，也要顾到{secondary}；先用相处事实判断谁值得留下。"

single.dimension.connection: "你更需要分清一时心动，还是对方愿意稳定靠近。"
single.dimension.response: "你要看对方是否愿意回应，而不是只看聊天热不热闹。"
single.dimension.daily_cooperation: "你要看见面时间和日常安排能否慢慢对上。"
single.dimension.boundaries: "你需要分清正常分歧，还是对方反复越过你的底线。"
single.dimension.stability: "你要看对方能否持续出现，并把说过的话做出来。"

single.year.judgment.connection.supportive: "今年有人愿意稳定靠近你，适合用相处事实判断是否继续了解。"
single.year.judgment.connection.mixed: "今年容易遇到让你心动的人，但对方的稳定回应还需要确认。"
single.year.judgment.connection.pressured: "今年认识人的机会不少，但对方是否认真容易让你反复猜测。"
single.year.judgment.response.supportive: "今年你和对方更容易把话说明白，也更容易看清彼此的想法。"
single.year.judgment.response.mixed: "今年聊天容易开始，但对方能否持续回应仍要看实际行动。"
single.year.judgment.response.pressured: "今年你容易因为回应忽冷忽热而多想，需要直接问清对方的态度。"
single.year.judgment.daily_cooperation.supportive: "今年你和对方较容易约到时间，见面后的相处也更自然。"
single.year.judgment.daily_cooperation.mixed: "今年彼此有见面的意愿，但时间和生活安排常常对不上。"
single.year.judgment.daily_cooperation.pressured: "今年你和对方很难稳定见面，关系容易只停留在聊天里。"
single.year.judgment.boundaries.supportive: "今年你更敢说出自己的要求，也更容易看清对方是否尊重你。"
single.year.judgment.boundaries.mixed: "今年你会遇到吸引你的人，也会碰到需要及时拒绝的做法。"
single.year.judgment.boundaries.pressured: "今年对方若反复试探你的底线，继续投入只会让你更累。"
single.year.judgment.stability.supportive: "今年对方更可能持续出现，你可以慢慢确认这份认真能否保持。"
single.year.judgment.stability.mixed: "今年有人表达认真，但对方能否长期做到还需要用时间验证。"
single.year.judgment.stability.pressured: "今年对方说得多、做得少时，你不适合过早投入太多感情。"

single.risk.connection: "如果你只凭心动投入，很容易忽略对方有没有持续靠近。"
single.risk.response: "如果对方经常不回应，你不必一直猜测，更不要替对方找理由。"
single.risk.daily_cooperation: "如果总是约不到时间，这段认识很难从聊天变成真实相处。"
single.risk.boundaries: "如果对方反复忽视你的拒绝，就不值得继续投入时间。"
single.risk.stability: "如果对方的说法经常变化，你不适合过早确定关系。"

single.signal.connection: "你会发现有人主动联系你，而且连续几周都有回应。"
single.signal.response: "你说出真实想法后，对方愿意回答，也会主动问你的感受。"
single.signal.daily_cooperation: "你和对方能够约到时间，临时取消见面的情况也会减少。"
single.signal.boundaries: "你拒绝一件事后，对方能够停止，也不会让你反复解释。"
single.signal.stability: "对方答应的见面和联系能够做到，不只停留在口头上。"

single.year.first.focus: "第一年：先分清谁值得你继续花时间了解。"
single.year.second.focus: "第二年：再看这份了解能不能变成稳定相处。"
single.year.later.focus: "第三年：只把时间留给愿意认真行动的人。"
single.year.first.signal: "你会更快分清短暂热情和持续靠近的区别。"
single.year.second.signal: "你和同一个人的联系若能持续，关系会变得更明确。"
single.year.later.signal: "你会减少无结果的联系，把注意力留给认真回应的人。"
single.year.first.action: "你先写下继续了解一个人时最看重的三件事。"
single.year.second.action: "你要和对方谈一次彼此想要什么样的关系。"
single.year.later.action: "你要停止维持长期没有回应、也没有见面的联系。"

single.action.connection.first: "你先用三次稳定见面判断对方是否值得继续了解。"
single.action.connection.second: "你要确认对方是否愿意固定联系和安排见面。"
single.action.connection.later: "你只为持续靠近你的人保留时间和情绪。"
single.action.response.first: "你可以直接问对方想继续了解，还是只想偶尔聊天。"
single.action.response.second: "你要把自己的真实想法说清，再看对方怎样回答。"
single.action.response.later: "你要减少和长期敷衍回应的人反复聊天。"
single.action.daily_cooperation.first: "你和对方先约一次双方都能做到的见面。"
single.action.daily_cooperation.second: "你要看对方是否愿意为见面提前安排时间。"
single.action.daily_cooperation.later: "你只保留能够进入真实生活的相处方式。"
single.action.boundaries.first: "你要在不舒服时直接拒绝，并看对方是否尊重。"
single.action.boundaries.second: "你要告诉对方哪些做法会让你停止继续了解。"
single.action.boundaries.later: "你要离开反复试探底线、又不愿改正的人。"
single.action.stability.first: "你先记录对方答应过什么，再看这些事情有没有做到。"
single.action.stability.second: "你要用持续相处判断认真，不要只听一次承诺。"
single.action.stability.later: "你只和说法稳定、行动一致的人讨论未来。"

single.transition.easing: "你和对方的相处比上一年顺，可以继续看行动是否稳定。"
single.transition.steady: "你和对方的相处变化不大，仍要用持续行动作判断。"
single.transition.tightening: "你和对方的相处比上一年费力，需要减少没有回应的投入。"
single.transition.later: "三年里留下的判断标准，可以继续帮你筛选合适的人。"

# 已确认交往关系
dating.thesis: "未来三年重点看两个人能否继续走下去，以及哪些分歧要尽早说清。"
dating.summary.with_risk: "主要看{primary}，也要顾到{secondary}；{risk}有压力时，两个人先把话说清。"
dating.summary.without_risk: "主要看{primary}，也要顾到{secondary}；两个人用稳定行动决定是否继续走下去。"

dating.dimension.connection: "两个人需要确认彼此都在投入，不是一方一直主动。"
dating.dimension.response: "两个人要把真实想法说清，也要听懂对方在意什么。"
dating.dimension.daily_cooperation: "两个人能否安排好见面和各自生活，会越来越重要。"
dating.dimension.boundaries: "出现分歧时，两个人怎么说话，比谁先认错更重要。"
dating.dimension.stability: "这段关系能否继续，要看承诺能不能变成稳定行动。"

dating.year.judgment.connection.supportive: "今年两个人都愿意主动靠近，关系可以在稳定相处中继续发展。"
dating.year.judgment.connection.mixed: "今年两个人仍有感情，但谁更主动、谁更投入容易变成问题。"
dating.year.judgment.connection.pressured: "今年一方若长期不主动，另一方会越来越怀疑这段关系。"
dating.year.judgment.response.supportive: "今年两个人更容易把想法说清，误会也能及时解释。"
dating.year.judgment.response.mixed: "今年两个人愿意沟通，但有些真实想法仍容易绕着说。"
dating.year.judgment.response.pressured: "今年两个人若继续回避重要问题，小误会会慢慢变成不满。"
dating.year.judgment.daily_cooperation.supportive: "今年两个人较容易安排见面，也能照顾彼此原来的生活。"
dating.year.judgment.daily_cooperation.mixed: "今年两个人想多相处，但时间和生活安排容易互相影响。"
dating.year.judgment.daily_cooperation.pressured: "今年见面和联系若总靠一方迁就，关系会越来越累。"
dating.year.judgment.boundaries.supportive: "今年两个人更能尊重彼此的选择，分歧不必变成争吵。"
dating.year.judgment.boundaries.mixed: "今年两个人会碰到分歧，需要分清哪些能商量、哪些不能勉强。"
dating.year.judgment.boundaries.pressured: "今年两个人若用冷淡或指责解决分歧，感情会被反复消耗。"
dating.year.judgment.stability.supportive: "今年两个人更愿意做长期安排，关系也更容易稳定下来。"
dating.year.judgment.stability.mixed: "今年两个人会谈到未来，但能否做到仍要看实际安排。"
dating.year.judgment.stability.pressured: "今年未来说得很多、实际安排很少时，关系容易停在原地。"

dating.risk.connection: "如果总是一方主动联系，两个人会越来越难感到被重视。"
dating.risk.response: "如果两个人回避真实想法，沉默会让误会越积越多。"
dating.risk.daily_cooperation: "如果见面和生活总靠一方迁就，感情会慢慢变成负担。"
dating.risk.boundaries: "如果两个人用冷淡、指责或控制处理分歧，问题会反复出现。"
dating.risk.stability: "如果未来只有口头说法，没有具体安排，两个人会越来越不安。"

dating.signal.connection: "两个人都会主动联系，也愿意为见面留出时间。"
dating.signal.response: "你说出不舒服时，对方愿意听完并认真回答。"
dating.signal.daily_cooperation: "两个人能够安排见面，也不会长期打乱一方的生活。"
dating.signal.boundaries: "两个人有分歧时仍能好好说话，不用冷淡逼对方让步。"
dating.signal.stability: "两个人开始讨论具体安排，并且按说好的事情去做。"

dating.year.first.focus: "第一年：先看两个人是否愿意认真处理差异。"
dating.year.second.focus: "第二年：再看这段关系能否进入稳定安排。"
dating.year.later.focus: "第三年：决定哪些相处方式值得长期保留。"
dating.year.first.signal: "两个人会更清楚彼此真正不能接受的事情。"
dating.year.second.signal: "两个人若能解决重复问题，相处会比以前安稳。"
dating.year.later.signal: "两个人会更在意长期安排，而不是一时情绪。"
dating.year.first.action: "两个人先说清接下来半年各自最在意的一件事。"
dating.year.second.action: "两个人每月留一次时间，只谈相处中需要改变的事。"
dating.year.later.action: "两个人把已经有效的相处办法写下来并继续做到。"

dating.action.connection.first: "两个人先确认联系和见面的期待是否一致。"
dating.action.connection.second: "两个人要轮流主动安排一次见面或共同活动。"
dating.action.connection.later: "两个人要保留固定相处时间，不让联系只靠临时想起。"
dating.action.response.first: "两个人各说一件最近没有说出口的真实想法。"
dating.action.response.second: "两个人发生误会时，要在当天说明各自听到的意思。"
dating.action.response.later: "两个人要保留直接说真话的习惯，不用猜测代替回答。"
dating.action.daily_cooperation.first: "两个人先排出一个月都能做到的见面时间。"
dating.action.daily_cooperation.second: "两个人要重新分配相处、工作和独处的时间。"
dating.action.daily_cooperation.later: "两个人要保留不会让任何一方长期疲惫的安排。"
dating.action.boundaries.first: "两个人先说清争吵时绝对不能使用的做法。"
dating.action.boundaries.second: "两个人出现分歧时，要先停下指责再讨论事情。"
dating.action.boundaries.later: "两个人要停止反复使用已经伤害过对方的说话方式。"
dating.action.stability.first: "两个人先把半年内能做到的安排说清楚。"
dating.action.stability.second: "两个人要核对说过的计划，看看哪些已经真正做到。"
dating.action.stability.later: "两个人只保留双方都愿意持续做到的长期安排。"

dating.transition.easing: "两个人比上一年更能互相配合，可以继续增加具体安排。"
dating.transition.steady: "两个人的相处变化不大，需要继续解决反复出现的问题。"
dating.transition.tightening: "两个人比上一年更容易争执，需要先减少彼此的消耗。"
dating.transition.later: "三年里已经验证有效的相处办法，值得两个人继续保留。"

# 已婚或长期共同生活
married.thesis: "未来三年重点看共同生活是否稳当，以及怎样减少反复消耗。"
married.summary.with_risk: "主要看{primary}，也要顾到{secondary}；{risk}有压力时，夫妻先处理具体生活问题。"
married.summary.without_risk: "主要看{primary}，也要顾到{secondary}；夫妻把有效做法留在共同生活里。"

married.dimension.connection: "夫妻需要保留主动关心，不能只剩下生活事务。"
married.dimension.response: "夫妻要把不满说清，也要认真听懂对方需要什么。"
married.dimension.daily_cooperation: "家务、时间和开支能否合理安排，会直接影响相处。"
married.dimension.boundaries: "夫妻有分歧时要保护彼此尊严，也要守住各自能接受的范围。"
married.dimension.stability: "共同生活能否稳定，要看重要决定能不能一起商量并做到。"

married.year.judgment.connection.supportive: "今年夫妻更愿意主动关心彼此，感情不会只剩下日常事务。"
married.year.judgment.connection.mixed: "今年夫妻仍关心彼此，但忙碌容易挤掉单独相处的时间。"
married.year.judgment.connection.pressured: "今年夫妻若只谈家务和开支，彼此会越来越难感到亲近。"
married.year.judgment.response.supportive: "今年夫妻更容易把话说开，旧误会也有机会真正解释。"
married.year.judgment.response.mixed: "今年夫妻愿意谈问题，但一着急仍容易说出伤人的话。"
married.year.judgment.response.pressured: "今年夫妻若继续沉默或互相指责，小事也会反复引起争吵。"
married.year.judgment.daily_cooperation.supportive: "今年家务、时间和开支较容易安排，夫妻能少为琐事争执。"
married.year.judgment.daily_cooperation.mixed: "今年共同生活需要重新安排，否则一方会觉得自己承担太多。"
married.year.judgment.daily_cooperation.pressured: "今年家务和开支若长期分配不均，夫妻都会感到疲惫。"
married.year.judgment.boundaries.supportive: "今年夫妻更能尊重彼此的选择，分歧不会轻易伤到感情。"
married.year.judgment.boundaries.mixed: "今年夫妻会碰到意见不同，需要避免把问题变成人身指责。"
married.year.judgment.boundaries.pressured: "今年夫妻若反复翻旧账或冷战，生活中的不满会越来越重。"
married.year.judgment.stability.supportive: "今年夫妻更适合一起做重要安排，并把决定逐步落实。"
married.year.judgment.stability.mixed: "今年夫妻会讨论长期安排，但需要确认双方都愿意承担。"
married.year.judgment.stability.pressured: "今年重要决定若总由一方做主，另一方会越来越没有参与感。"

married.risk.connection: "如果夫妻长期只谈事情、不谈感受，亲近感会慢慢减少。"
married.risk.response: "如果夫妻用沉默或指责代替回答，误会会在日常生活里反复出现。"
married.risk.daily_cooperation: "如果家务、时间和开支长期不均，一方会越来越疲惫。"
married.risk.boundaries: "如果夫妻争吵时翻旧账或羞辱对方，问题会越来越难解决。"
married.risk.stability: "如果重要决定总由一方做主，共同生活会失去平衡。"

married.signal.connection: "夫妻会主动问候彼此，也愿意留出不谈家务的相处时间。"
married.signal.response: "你说出不满时，对方愿意听完并回答具体问题。"
married.signal.daily_cooperation: "家务、时间和开支有明确安排，夫妻不用反复提醒。"
married.signal.boundaries: "夫妻有分歧时仍能尊重彼此，不用冷战或翻旧账。"
married.signal.stability: "夫妻对重要决定有共同说法，也能按商量好的办法执行。"

married.year.first.focus: "第一年：先找出共同生活中最消耗彼此的事情。"
married.year.second.focus: "第二年：把已经谈好的生活安排稳定下来。"
married.year.later.focus: "第三年：保留有效做法，减少同一问题反复出现。"
married.year.first.signal: "夫妻会更清楚哪些生活问题最容易引起争执。"
married.year.second.signal: "夫妻若能按新安排生活，重复争执会开始减少。"
married.year.later.signal: "夫妻会更愿意一起决定重要事情，也更少互相埋怨。"
married.year.first.action: "你和家人先列出共同生活中最常争执的两件事。"
married.year.second.action: "夫妻每月检查一次家务、时间和开支安排是否公平。"
married.year.later.action: "夫妻把已经有效的生活安排固定下来并继续执行。"

married.action.connection.first: "夫妻每周留一次不谈家务和开支的相处时间。"
married.action.connection.second: "你要主动问对方最近最累的事情，并认真听完。"
married.action.connection.later: "夫妻要保留固定的单独相处时间，不只一起处理事情。"
married.action.response.first: "夫妻各说一件最近没有说清的不满和需要。"
married.action.response.second: "夫妻争执后要把误会说清，不让沉默拖过当天。"
married.action.response.later: "夫妻要保留直接回答问题的习惯，不用冷淡结束谈话。"
married.action.daily_cooperation.first: "夫妻先把家务、接送和固定开支列在一起。"
married.action.daily_cooperation.second: "夫妻要重新分配让一方长期疲惫的生活事务。"
married.action.daily_cooperation.later: "夫妻要保留双方都能长期做到的生活分工。"
married.action.boundaries.first: "夫妻先约定争吵时不能使用的三种做法。"
married.action.boundaries.second: "夫妻出现分歧时，要先谈事情，不翻过去的旧账。"
married.action.boundaries.later: "夫妻要停止已经证明会伤害彼此的争吵方式。"
married.action.stability.first: "夫妻先把一年内要做的重要决定排出先后。"
married.action.stability.second: "夫妻要确认每个重要安排由谁负责、何时完成。"
married.action.stability.later: "夫妻要一起检查长期安排是否仍符合双方需要。"

married.transition.easing: "夫妻比上一年更能互相配合，可以继续完善生活安排。"
married.transition.steady: "夫妻的相处变化不大，需要继续解决重复出现的问题。"
married.transition.tightening: "夫妻比上一年更容易疲惫，需要先减少日常生活中的消耗。"
married.transition.later: "三年里已经证明有效的办法，值得继续留在共同生活中。"
