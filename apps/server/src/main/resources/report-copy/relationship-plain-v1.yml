single.current.detail.connection.supportive: "按这份年度解读，今年适合主动接触、多一些交流。不必先把恋爱往后放，可以给新的认识留一些时间。"
single.current.detail.connection.mixed: "今年可以尝试认识人，但开始接触和继续投入不是同一回事。有了接触对象，也要看对方是否愿意认真了解你。"
single.current.detail.connection.pressured: "今年不宜为了开始一段关系，就不断增加单方面的付出。有了接触对象，先确认联系是不是有来有往。"
single.current.detail.connection.quiet: "认识新的人不是今年的主要变化，不用因为报告谈到感情，就认定一定会有人出现。可以把精力放在自己愿意接触的人身上。"
single.current.scene.no_contact: "如果你目前没有正在了解的人，可以参加自己愿意去的活动，或接受你信任的朋友介绍。不用为了恋爱，勉强自己去不喜欢的场合。"
single.current.scene.has_contact: "如果已经有聊得来的人，可以试着提出一次具体邀约。比起反复猜测一句话的意思，一次双方都愿意的见面，更能帮助你了解彼此。"
single.current.detail.response.supportive: "有了接触对象之后，今年较适合通过聊天把想法说清，看看彼此是否聊得来。"
single.current.detail.response.mixed: "有了接触对象之后，可以继续聊，但要看彼此是否愿意认真回答，而不只是保持闲聊。"
single.current.detail.response.pressured: "有了接触对象之后，如果重要问题一直没有回答，不宜靠猜测来确定对方的态度。可以直接问清彼此是否想继续了解。"
single.current.detail.response.quiet: "聊天不是今年最突出的变化，不必反复猜测每一句话。是否值得继续了解，仍要结合见面和实际相处。"
single.current.detail.daily_cooperation.supportive: "见面方面，可以试着商量双方都方便的时间。实际相处，比一直在线上聊天更能帮助你了解一个人。"
single.current.detail.daily_cooperation.mixed: "见面安排需要多一些商量。如果一方临时有事，可以一起重新约时间，不要只看一次邀约有没有成功。"
single.current.detail.daily_cooperation.pressured: "见面和各自生活能否配合，是今年需要认真考虑的事。如果长期只有你调整安排，就需要问清对方是否愿意一起想办法。"
single.current.detail.daily_cooperation.quiet: "时间安排不是今年的主要变化。认识之后，仍可以通过一次双方愿意的见面，看看实际相处是否合适。"
single.current.detail.stability.supportive: "长期相处的判断偏积极，可以慢慢了解，不必只停在短暂聊天。有了接触对象，再看联系和约定能否持续下去。"
single.current.detail.stability.mixed: "长期相处既有有利的一面，也有需要留心的地方。能够开始认识，不等于已经适合在一起，不必只凭刚开始的热情做决定。"
single.current.detail.stability.pressured: "长期相处需要更慎重。认识之后，如果承诺很多、做到的事很少，就不适合急着增加投入或做共同安排。"
single.current.detail.stability.quiet: "今年的判断不以长期承诺为主。可以先了解眼前这个人，不必刚有接触就讨论很远的将来。"
single.current.observe.response: "有了接触对象，可以看你说出想法后，对方是否认真回答，也愿意说说自己的想法。"
single.current.observe.daily_cooperation: "可以看双方能否商量出见面时间；临时有事时，是否愿意说明并重新约。"

single.current.risk.connection: "今年需要留意的，是联系会不会一直靠你一个人维持。有了好感，也要给对方表达意愿的机会。"
single.current.risk.response: "今年需要留意的，是彼此有没有把真实想法说明白。有了好感，不代表重要问题就可以一直不谈。"
single.current.risk.daily_cooperation: "今年需要留意的，是联系和见面是否总要你迁就。喜欢一个人，也要保留自己正常的生活安排。"
single.current.risk.boundaries: "今年需要多留心的，是有好感之后，两个人能不能接受彼此的不同想法。不要因为想谈恋爱，就把自己的不舒服压下去。"
single.current.risk.stability: "今年需要留意的，是对未来的说法能不能变成实际行动。有了好感，不必马上答应超出自己意愿的长期安排。"
single.current.example.connection: "如果你每次都先联系，而对方既不主动，也很少回应，可以先减少单方面付出。不要把持续追问当成增进了解。"
single.current.example.response: "如果你问是否想继续了解，对方总转移话题，可以把问题说得直接一些。不要替对方给出一个自己期待的回答。"
single.current.example.daily_cooperation: "如果见面总临时取消，可以问对方是否愿意重新安排。若一直只有你改时间，就重新考虑这样的相处是否合适。"
single.current.example.boundaries: "比如，你说某天不方便见面，对方是否愿意另约时间。如果你已经把意思说清，对方仍反复要求你让步，就不必为了维持联系勉强答应。"
single.current.example.stability: "如果对方谈了很多以后，却连眼前说好的事情也常常不做，可以先放慢决定。让实际相处走在承诺前面。"

