openapi: 3.0.3
info:
  title: 八字排盘 App API
  version: 0.1.0
  description: 八字排盘与命书生成的前后端接口契约。
x-planned-contracts:
  wealth-narrative-v3:
    status: implemented
    schema: ./drafts/wealth-v3.schema.json
    types: ./drafts/wealth-v3.ts
    design: ../docs/design/wealth-v3-expression-contract.md
    description: 后端生成、快照保存读取及前端独立阅读分支均已接入；系统级浏览器与 MySQL 验证留待任务 9。
x-report-products:
  pricingAuthority: server
  currency: CNY
  paymentMode: mock-only
  description: 单份命书的价格只能由服务端商品目录决定；客户端不得提交或覆盖金额。当前模拟支付不能代表真实扣款。
  available:
    - topic: career
      edition: plain
      amountCents: 690
    - topic: wealth
      edition: plain
      amountCents: 690
    - topic: relationship
      edition: plain
      amountCents: 690
  unavailable:
    - topic: overall
      edition: plain
    - topic: overall
      edition: professional
    - topic: career
      edition: professional
    - topic: wealth
      edition: professional
    - topic: relationship
      edition: professional
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: 注册并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      summary: 登录并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /me:
    get:
      summary: 当前用户与会员状态（需 Bearer token）
      responses:
        '200':
          description: 会员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInfo'
  /redeem:
    post:
      summary: 兑换码开通/延长会员（需 Bearer token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: 会员信息
          content:
            application/json:
            schema:
              $ref: '#/components/schemas/MembershipInfo'
  /orders:
    post:
      summary: 创建会员套餐订单（需 Bearer token；金额由后端套餐常量定价）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 创建的待支付订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderInfo'
  /pay/mock-success/{orderId}:
    post:
      summary: 模拟支付成功回调（仅非生产环境，需 Bearer token；幂等，不重复顺延）
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 开通后的会员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInfo'
  /pay/callback:
    post:
      summary: 真实支付渠道回调占位（无需 token；待资质接入后启用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayCallbackRequest'
      responses:
        '400':
          description: 当前不可用（PAY_CALLBACK_NOT_READY）
  /records:
    # 需 Authorization: Bearer <token>
    post:
      summary: 排盘并保存一条记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaipanRequest'
      responses:
        '200':
          description: 排盘结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaipanResult'
    get:
      summary: 我的排盘历史
      responses:
        '200':
          description: 记录列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaipanResult'
    delete:
      summary: 清空当前用户全部排盘记录（需 Bearer token）
      responses:
        '204':
          description: 清空成功
  /records/{id}:
    get:
      summary: 单条排盘记录
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 排盘结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaipanResult'
  /reports:
    post:
      summary: 使用会员权益创建文字型命书（需 Bearer token）
      description: 仅有效会员可直接调用；会员每天最多成功生成三份。非会员返回 REPORT_PAYMENT_REQUIRED，必须改走 /reports/checkout，不能用本接口绕过购买。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPreviewRequest'
      responses:
        '200':
          description: 报告生成记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInfo'
        '400':
          description: 非会员需购买（REPORT_PAYMENT_REQUIRED）、会员当日额度已用完（MEMBER_DAILY_REPORT_LIMIT）或内容生成失败。
    get:
      summary: 我的命书列表（需 Bearer token；只返回 ready 报告）
      description: locked 报告在支付完成前不会出现在列表中。
      responses:
        '200':
          description: 报告列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportInfo'
  /reports/checkout:
    post:
      summary: 创建单份命书订单和锁定报告（需 Bearer token）
      description: 金额由服务端商品目录决定，客户端不提交价格。命书先完成生成并保存为 locked；支付前 locked 报告不可通过列表或详情读取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPreviewRequest'
      responses:
        '200':
          description: 待支付订单与其唯一关联的锁定报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCheckoutInfo'
        '400':
          description: 商品未开放（REPORT_PRODUCT_UNAVAILABLE）或命书生成失败；失败时不创建可收费订单。
  /reports/checkout/{orderId}/mock-pay:
    post:
      summary: 模拟支付并解锁单份命书（仅非生产环境，需 Bearer token）
      description: 仅非生产环境可用；操作幂等，重复确认不会重复创建或解锁。成功后返回 checkout 时生成的同一份命书，而不是重新生成。
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已变为 ready 的同一份命书
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInfo'
        '400':
          description: 订单不存在、状态异常、模拟支付被禁用或命书解锁失败。
  /reports/preview:
    post:
      deprecated: true
      summary: 旧版 PDF 联调预览（兼容保留，不再作为事业命书主流程）
      description: 新流程使用 POST /reports 保存内容快照，并在页面阅读。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPreviewRequest'
      responses:
        '200':
          description: 可搜索文字的 PDF 文件
          headers:
            Content-Disposition:
              schema: { type: string }
              description: UTF-8 编码的下载文件名
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400':
          description: 主题、版本、排盘参数或事业状态问卷不受支持
        '401':
          description: 未登录或 token 无效
  /reports/{id}:
    get:
      summary: 命书详情（需 Bearer token）
      description: 仅报告所有者可以读取 ready 报告；locked 报告统一返回 404，避免未支付内容泄露。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 报告详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInfo'
components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
    MembershipInfo:
      type: object
      properties:
        username:
          type: string
        plan:
          type: string
          nullable: true
        memberExpireAt:
          type: string
          format: date-time
          nullable: true
        isMember:
          type: boolean
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    CreateOrderRequest:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          description: 套餐标识，member_1m / member_3m
    OrderInfo:
      type: object
      properties:
        id:
          type: integer
        plan:
          type: string
        amountCents:
          type: integer
        status:
          type: string
        provider:
          type: string
          nullable: true
        providerTradeNo:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
    PayCallbackRequest:
      type: object
      required: [orderId, provider, providerTradeNo]
      properties:
        orderId:
          type: integer
        provider:
          type: string
        providerTradeNo:
          type: string
    ReportTopic:
      type: string
      enum: [overall, career, wealth, relationship]
    ReportEdition:
      type: string
      enum: [plain, professional]
      description: 当前单份商品只开放事业、财富、感情通俗版；综合通俗版仅向会员开放内容验收，尚未进入单份商品目录；所有专业版均未开放。
    ReportPreviewRequest:
      type: object
      required: [request, topic, edition]
      description: overall v1.1 和 wealth v3 不需要问卷；career 必须提交 careerContext；relationship v1 必须提交 relationshipContext。综合与财富通俗版固定输出三年；感情单身版输出今年重点与明年参考，交往中和已婚版输出三年；专业版暂未开放。综合通俗版当前仅供会员验收，不支持单份购买；历史 overall v1 报告继续可读。
      properties:
        request:
          $ref: '#/components/schemas/PaipanRequest'
        topic:
          $ref: '#/components/schemas/ReportTopic'
        edition:
          $ref: '#/components/schemas/ReportEdition'
        careerContext:
          $ref: '#/components/schemas/CareerContext'
        wealthContext:
          deprecated: true
          description: 旧版财富问卷兼容字段；可省略，wealth v2 接受但完全忽略，将在后续契约中删除。
          allOf:
            - $ref: '#/components/schemas/WealthContext'
        relationshipContext:
          $ref: '#/components/schemas/RelationshipContextRequest'
    CareerContext:
      type: object
      required: [status, goal, pace]
      description: 事业现实状态只用于解释分支与行动建议，不计入命理证据。
      properties:
        status:
          type: string
          enum: [employed, self_employed, job_seeking, studying]
        goal:
          type: string
          enum: [promotion, job_change, stability, transition]
        pace:
          type: string
          enum: [smooth, stalled, high_pressure, preparing_change]
    WealthContext:
      type: object
      required: [incomeSource, goal, pace]
      deprecated: true
      description: wealth-narrative-v1 的历史字段；wealth v2 不读取、不保存为用户答案，也不允许其影响证据、排序或文案。
      properties:
        incomeSource:
          type: string
          enum: [salary, self_employed, mixed, unstable]
        goal:
          type: string
          enum: [increase_income, stabilize_cashflow, reduce_pressure, new_income_source]
        pace:
          type: string
          enum: [stable, income_fluctuating, spending_pressure, preparing_adjustment]
    RelationshipContextRequest:
      type: object
      required: [status]
      description: 感情状态只决定通俗文案的问题角度与行动表达，不参与证据提取、权重、排序、风险或年度趋势计算。
      properties:
        status:
          type: string
          enum: [single, dating, married]
          description: single=单身或尚未确定关系；dating=已确认交往关系；married=已婚或长期共同生活。
    ReportCheckoutInfo:
      type: object
      required: [orderId, reportId, topic, edition, amountCents, status]
      properties:
        orderId:
          type: integer
        reportId:
          type: integer
          description: checkout 时已经生成并锁定的报告 ID；支付成功后解锁的仍是此 ID。
        topic:
          $ref: '#/components/schemas/ReportTopic'
        edition:
          $ref: '#/components/schemas/ReportEdition'
        amountCents:
          type: integer
          readOnly: true
          description: 服务端商品目录确定的人民币分值；当前开放商品均为 690。
        status:
          type: string
          enum: [pending]
    ReportInfo:
      type: object
      required: [id, subject, topic, edition, status, contentVersion, content, createdAt, generatedAt]
      properties:
        id: { type: integer }
        subject: { type: string }
        topic: { $ref: '#/components/schemas/ReportTopic' }
        edition: { $ref: '#/components/schemas/ReportEdition' }
        status: { type: string, enum: [ready] }
        contentVersion:
          type: string
          description: career-narrative-v1/v2/v3、wealth-narrative-v1 使用旧内容结构；wealth-narrative-v2/v3 与 relationship-narrative-v1 使用各自独立结构。新生成的财富通俗版为 wealth-narrative-v3。
        content:
          oneOf:
            - $ref: '#/components/schemas/CareerNarrativePlan'
            - $ref: '#/components/schemas/WealthNarrativePlan'
            - $ref: '#/components/schemas/RelationshipNarrativePlan'
            - $ref: './drafts/wealth-v3.schema.json#/definitions/Content'
          description: 由 contentVersion 判别；旧事业及财富 v1 使用 CareerNarrativePlan，财富 v2 使用 WealthNarrativePlan，财富 v3 使用独立 Content，感情 v1 使用 RelationshipNarrativePlan。
        createdAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
    CareerNarrativePlan:
      type: object
      required: [thesis, contextSummary, years, route]
      properties:
        thesis: { type: string }
        contextSummary: { type: string }
        years:
          type: array
          items: { $ref: '#/components/schemas/CareerYearNarrative' }
        route:
          type: array
          items: { type: string }
    CareerYearNarrative:
      type: object
      properties:
        year: { type: integer }
        ganZhi: { type: string }
        stage: { type: string }
        headline: { type: string }
        verdict: { type: string }
        reasons:
          type: array
          items: { type: string }
        obstacle: { type: string }
        actions:
          type: array
          items: { type: string }
        changeCondition: { type: string }
        evidenceKeys:
          type: array
          items: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ReportEvidence' }
        counterEvidence:
          type: array
          items: { $ref: '#/components/schemas/ReportEvidence' }
        confidence: { type: string }
    WealthPathCode:
      type: string
      enum:
        - stable_income
        - skill_income
        - project_income
        - cooperation_income
        - retention
    WealthNarrativePlan:
      type: object
      description: wealth-narrative-v2 的三年通俗版快照。产品固定三年；horizonYears 只在响应中说明快照长度，不是请求参数。
      required:
        - horizonYears
        - thesis
        - summary
        - paths
        - primaryPathCode
        - secondaryPathCode
        - mainRisk
        - years
        - route
      properties:
        horizonYears:
          type: integer
          enum: [3]
          readOnly: true
        thesis: { type: string }
        summary: { type: string }
        paths:
          type: array
          minItems: 5
          maxItems: 5
          description: 必须且仅包含五个 WealthPathCode，各出现一次。
          items: { $ref: '#/components/schemas/WealthPathSummary' }
        primaryPathCode: { $ref: '#/components/schemas/WealthPathCode' }
        secondaryPathCode: { $ref: '#/components/schemas/WealthPathCode' }
        mainRisk: { $ref: '#/components/schemas/WealthRiskSummary' }
        years:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/WealthYearNarrative' }
        route:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: string }
    WealthPathSummary:
      type: object
      required: [code, label, status, judgment, supportingEvidenceKeys, limitingEvidenceKeys]
      properties:
        code: { $ref: '#/components/schemas/WealthPathCode' }
        label: { type: string }
        status:
          type: string
          enum: [主要方向, 辅助方向, 需要留意, 表现一般]
        judgment: { type: string }
        supportingEvidenceKeys:
          type: array
          uniqueItems: true
          items: { type: string }
        limitingEvidenceKeys:
          type: array
          uniqueItems: true
          items: { type: string }
    WealthRiskSummary:
      type: object
      required: [pathCode, label, judgment, evidenceKeys]
      properties:
        pathCode: { $ref: '#/components/schemas/WealthPathCode' }
        label: { type: string }
        judgment: { type: string }
        evidenceKeys:
          type: array
          uniqueItems: true
          items: { type: string }
    WealthYearNarrative:
      type: object
      required:
        - year
        - ganZhi
        - focus
        - incomeSource
        - retention
        - mainLimit
        - realitySignals
        - actions
        - transition
        - evidenceKeys
      properties:
        year: { type: integer }
        ganZhi: { type: string }
        focus: { type: string }
        incomeSource: { type: string }
        retention: { type: string }
        mainLimit: { type: string }
        realitySignals:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        actions:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        transition: { type: string }
        evidenceKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    RelationshipStatus:
      type: string
      enum: [single, dating, married]
    RelationshipDimensionCode:
      type: string
      enum: [connection, response, daily_cooperation, boundaries, stability]
    RelationshipNarrativePlan:
      type: object
      description: relationship-narrative-v1 的三年通俗版快照。规则权重只表示规则在本报告中的方向与显著程度，不是统计概率，也不保证现实事件发生。
      required:
        - relationshipStatus
        - relationshipStatusLabel
        - horizonYears
        - thesis
        - summary
        - dimensions
        - primaryDimensionCode
        - secondaryDimensionCode
        - focusTied
        - years
        - evidenceKeys
      properties:
        relationshipStatus: { $ref: '#/components/schemas/RelationshipStatus' }
        relationshipStatusLabel: { type: string }
        horizonYears:
          type: integer
          enum: [3]
          readOnly: true
        thesis: { type: string }
        summary: { type: string }
        dimensions:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/RelationshipDimensionSummary' }
        primaryDimensionCode: { $ref: '#/components/schemas/RelationshipDimensionCode' }
        secondaryDimensionCode: { $ref: '#/components/schemas/RelationshipDimensionCode' }
        focusTied: { type: boolean }
        mainRisk:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RelationshipRiskSummary'
        years:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/RelationshipYearNarrative' }
        evidenceKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    RelationshipDimensionSummary:
      type: object
      required: [code, label, status, tone, judgment, supportingEvidenceKeys, limitingEvidenceKeys]
      properties:
        code: { $ref: '#/components/schemas/RelationshipDimensionCode' }
        label: { type: string }
        status: { type: string }
        tone:
          type: string
          enum: [supportive, mixed, pressured, quiet]
        judgment: { type: string }
        supportingEvidenceKeys:
          type: array
          uniqueItems: true
          items: { type: string }
        limitingEvidenceKeys:
          type: array
          uniqueItems: true
          items: { type: string }
    RelationshipRiskSummary:
      type: object
      required: [dimensionCode, label, judgment, evidenceKeys]
      properties:
        dimensionCode: { $ref: '#/components/schemas/RelationshipDimensionCode' }
        label: { type: string }
        judgment: { type: string }
        evidenceKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    RelationshipYearNarrative:
      type: object
      required:
        - year
        - ganZhi
        - focus
        - judgment
        - realitySignals
        - actions
        - transition
        - primaryDimensionCode
        - secondaryDimensionCode
        - evidenceKeys
      properties:
        year: { type: integer }
        ganZhi: { type: string }
        focus: { type: string }
        judgment: { type: string }
        mainLimit:
          type: string
          nullable: true
          description: 仅在该年存在真实负面证据时出现。
        realitySignals:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string }
        actions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: string }
        transition: { type: string }
        primaryDimensionCode: { $ref: '#/components/schemas/RelationshipDimensionCode' }
        secondaryDimensionCode: { $ref: '#/components/schemas/RelationshipDimensionCode' }
        riskDimensionCode:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RelationshipDimensionCode'
        evidenceKeys:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    ReportEvidence:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string }
    PaipanRequest:
      type: object
      required: [gender, solarDateTime, trueSolarTime]
      properties:
        name:
          type: string
        gender:
          type: string
          enum: [male, female]
        solarDateTime:
          type: string
          description: ISO 格式公历时间，如 1995-10-08T14:30:00
        birthPlace:
          type: string
          description: 出生地，用于真太阳时
        trueSolarTime:
          type: boolean
    PaipanResult:
      type: object
      properties:
        solarText:
          type: string
        lunarText:
          type: string
        shengXiao:
          type: string
        timeZhi:
          type: string
          description: 时支（如"午"）
        pillars:
          type: object
          properties:
            year: { $ref: '#/components/schemas/Pillar' }
            month: { $ref: '#/components/schemas/Pillar' }
            day: { $ref: '#/components/schemas/Pillar' }
            time: { $ref: '#/components/schemas/Pillar' }
        taiYuan:
          type: string
          description: 胎元干支（月干进一、月支进三）
        taiYuanNaYin:
          type: string
        mingGong:
          type: string
          description: 命宫干支（月支+时支反推）
        mingGongNaYin:
          type: string
        shenGong:
          type: string
          description: 身宫干支
        shenGongNaYin:
          type: string
        wuXing:
          type: object
          properties:
            jin: { type: integer }
            mu: { type: integer }
            shui: { type: integer }
            huo: { type: integer }
            tu: { type: integer }
        daYun:
          type: array
          items:
            $ref: '#/components/schemas/DaYun'
        yunStart:
          $ref: '#/components/schemas/YunStart'
        liuNianList:
          type: array
          description: 起运后逐年流年（第一步大运内 10 年）
          items:
            $ref: '#/components/schemas/LiuNianItem'
        xiaoYunList:
          type: array
          description: 起运后逐年小运（时柱起，第一步大运内 10 年）
          items:
            $ref: '#/components/schemas/XiaoYunItem'
        currentYearLiuYue:
          type: array
          description: 当前公历年份的逐月流月（节气月 12 个）
          items:
            $ref: '#/components/schemas/LiuYueItem'
        currentYearGanZhi:
          type: string
        currentLiuNian:
          $ref: '#/components/schemas/LiuNianInfo'
        trueSolar:
          $ref: '#/components/schemas/TrueSolarInfo'
    Pillar:
      type: object
      properties:
        label:
          type: string
          enum: [year, month, day, time]
        gan:
          type: string
        zhi:
          type: string
        shiShen:
          type: string
        ziZuo:
          type: string
          description: 自坐——本柱天干在本柱地支的十二长生（如"长生""帝旺"），与星运（日干为太极点）口径不同
        hideGan:
          type: array
          items:
            type: object
            properties:
              gan: { type: string }
              shiShen:
                type: string
                description: 藏干对应日主的十神（副星）
              wuxing:
                type: string
                enum: [jin, mu, shui, huo, tu]
        naYin:
          type: string
        diShi:
          type: string
        xunKong:
          type: string
        shenSha:
          type: array
          items:
            type: string
    DaYun:
      type: object
      properties:
        ageRange:
          type: string
        ganZhi:
          type: string
        yearRange:
          type: string
        isCurrent:
          type: boolean
        naYin:
          type: string
          description: 大运纳音
        xunKong:
          type: string
          description: 大运旬空
        shiShen:
          type: string
          description: 大运天干对日主的十神（前端补充）
        starFortune:
          type: string
          description: 大运星运——大运地支对日主的十二长生（与四柱星运同口径）
        shenSha:
          type: array
          items:
            type: string
    YunStart:
      type: object
      description: 起运信息（公历）
      properties:
        year:
          type: integer
        month:
          type: integer
        day:
          type: integer
        hour:
          type: integer
        forward:
          type: boolean
          description: 大运顺行（阳男阴女/阴男阳女规则）
    LiuNianItem:
      type: object
      properties:
        year:
          type: integer
        age:
          type: integer
        ganZhi:
          type: string
        naYin:
          type: string
        shiShen:
          type: string
          description: 流年天干对日主的十神（前端补充）
        starFortune:
          type: string
          description: 流年星运——流年地支对日主的十二长生
        xunKong:
          type: string
          description: 流年旬空
        liuYue:
          type: array
          description: 该流年内逐月（节气月 12 个）
          items:
            $ref: '#/components/schemas/LiuYueItem'
        shenSha:
          type: array
          items:
            type: string
          description: 流年神煞（前端补充）
    LiuYueItem:
      type: object
      properties:
        index:
          type: integer
        monthName:
          type: string
          description: 节气月名（正月/二月…）
        ganZhi:
          type: string
        naYin:
          type: string
        xunKong:
          type: string
        shiShen:
          type: string
          description: 流月天干对日主的十神（前端补充）
        shenSha:
          type: array
          items:
            type: string
          description: 流月神煞（前端补充）
    XiaoYunItem:
      type: object
      properties:
        year:
          type: integer
        age:
          type: integer
        ganZhi:
          type: string
        naYin:
          type: string
        shiShen:
          type: string
          description: 小运天干对日主的十神（前端补充）
        shenSha:
          type: array
          items:
            type: string
          description: 小运神煞（前端补充）
    LiuNianInfo:
      type: object
      properties:
        ganZhi:
          type: string
        shenSha:
          type: array
          items:
            type: string
    TrueSolarInfo:
      type: object
      properties:
        original:
          type: string
        adjusted:
          type: string
        offsetMinutes:
          type: number
        eotMinutes:
          type: number
        longitude:
          type: number
        originalShichen:
          type: string
        adjustedShichen:
          type: string
        boundaryChanged:
          type: boolean
