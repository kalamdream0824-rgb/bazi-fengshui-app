openapi: 3.0.3
info:
  title: 八字排盘 App API
  version: 0.1.0
  description: 前后端契约草案。开发期前端使用 MockBaziApi，后端就绪后按本契约实现。
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: 注册并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      summary: 登录并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /me:
    get:
      summary: 当前用户与会员状态（需 Bearer token）
      responses:
        '200':
          description: 会员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInfo'
  /redeem:
    post:
      summary: 兑换码开通/延长会员（需 Bearer token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: 会员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInfo'
  /records:
    # 需 Authorization: Bearer <token>
    post:
      summary: 排盘并保存一条记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaipanRequest'
      responses:
        '200':
          description: 排盘结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaipanResult'
    get:
      summary: 我的排盘历史
      responses:
        '200':
          description: 记录列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaipanResult'
  /records/{id}:
    get:
      summary: 单条排盘记录
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 排盘结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaipanResult'
components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
    MembershipInfo:
      type: object
      properties:
        username:
          type: string
        plan:
          type: string
          nullable: true
        memberExpireAt:
          type: string
          format: date-time
          nullable: true
        isMember:
          type: boolean
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    PaipanRequest:
      type: object
      required: [gender, solarDateTime, trueSolarTime]
      properties:
        name:
          type: string
        gender:
          type: string
          enum: [male, female]
        solarDateTime:
          type: string
          description: ISO 格式公历时间，如 1995-10-08T14:30:00
        birthPlace:
          type: string
          description: 出生地，用于真太阳时
        trueSolarTime:
          type: boolean
    PaipanResult:
      type: object
      properties:
        solarText:
          type: string
        lunarText:
          type: string
        shengXiao:
          type: string
        pillars:
          type: object
          properties:
            year: { $ref: '#/components/schemas/Pillar' }
            month: { $ref: '#/components/schemas/Pillar' }
            day: { $ref: '#/components/schemas/Pillar' }
            time: { $ref: '#/components/schemas/Pillar' }
        wuXing:
          type: object
          properties:
            jin: { type: integer }
            mu: { type: integer }
            shui: { type: integer }
            huo: { type: integer }
            tu: { type: integer }
        daYun:
          type: array
          items:
            $ref: '#/components/schemas/DaYun'
        currentYearGanZhi:
          type: string
    Pillar:
      type: object
      properties:
        label:
          type: string
          enum: [year, month, day, time]
        gan:
          type: string
        zhi:
          type: string
        shiShen:
          type: string
        hideGan:
          type: array
          items:
            type: object
            properties:
              gan: { type: string }
              wuxing:
                type: string
                enum: [jin, mu, shui, huo, tu]
        naYin:
          type: string
        diShi:
          type: string
        xunKong:
          type: string
        shenSha:
          type: array
          items:
            type: string
    DaYun:
      type: object
      properties:
        ageRange:
          type: string
        ganZhi:
          type: string
        yearRange:
          type: string
        isCurrent:
          type: boolean
