openapi: 3.0.3
info:
  title: 八字排盘 App API
  version: 0.1.0
  description: 前后端契约草案。开发期前端使用 MockBaziApi，后端就绪后按本契约实现。
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: 注册并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      summary: 登录并返回 token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /me:
    get:
      summary: 当前用户与会员状态（需 Bearer token）
      responses:
        '200':
          description: 会员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInfo'
  /redeem:
    post:
      summary: 兑换码开通/延长会员（需 Bearer token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: 会员信息
          content:
            application/json:
            schema:
              $ref: '#/components/schemas/MembershipInfo'
  /orders:
    post:
      summary: 创建会员套餐订单（需 Bearer token；金额由后端套餐常量定价）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 创建的待支付订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderInfo'
  /pay/mock-success/{orderId}:
    post:
      summary: 模拟支付成功回调（仅非生产环境，需 Bearer token；幂等，不重复顺延）
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 开通后的会员信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipInfo'
  /pay/callback:
    post:
      summary: 真实支付渠道回调占位（无需 token；待资质接入后启用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayCallbackRequest'
      responses:
        '400':
          description: 当前不可用（PAY_CALLBACK_NOT_READY）
  /records:
    # 需 Authorization: Bearer <token>
    post:
      summary: 排盘并保存一条记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaipanRequest'
      responses:
        '200':
          description: 排盘结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaipanResult'
    get:
      summary: 我的排盘历史
      responses:
        '200':
          description: 记录列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaipanResult'
    delete:
      summary: 清空当前用户全部排盘记录（需 Bearer token）
      responses:
        '204':
          description: 清空成功
  /records/{id}:
    get:
      summary: 单条排盘记录
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 排盘结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaipanResult'
  /reports:
    post:
      summary: 创建一份文字型命书（需 Bearer token）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '200':
          description: 报告生成记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInfo'
    get:
      summary: 我的命书列表（需 Bearer token）
      responses:
        '200':
          description: 报告列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportInfo'
  /reports/{id}:
    get:
      summary: 命书详情（需 Bearer token）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 报告详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportInfo'
  /reports/{id}/download:
    get:
      summary: 下载已生成的文字型命书（需 Bearer token）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 可搜索文字的 PDF 文件
          content:
            application/pdf:
              schema: { type: string, format: binary }
components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
    MembershipInfo:
      type: object
      properties:
        username:
          type: string
        plan:
          type: string
          nullable: true
        memberExpireAt:
          type: string
          format: date-time
          nullable: true
        isMember:
          type: boolean
    RedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    CreateOrderRequest:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          description: 套餐标识，member_1m / member_3m
    OrderInfo:
      type: object
      properties:
        id:
          type: integer
        plan:
          type: string
        amountCents:
          type: integer
        status:
          type: string
        provider:
          type: string
          nullable: true
        providerTradeNo:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
    PayCallbackRequest:
      type: object
      required: [orderId, provider, providerTradeNo]
      properties:
        orderId:
          type: integer
        provider:
          type: string
        providerTradeNo:
          type: string
    ReportTopic:
      type: string
      enum: [overall, career, wealth, relationship]
    ReportEdition:
      type: string
      enum: [plain, professional]
    CreateReportRequest:
      type: object
      required: [recordId, topic, edition]
      properties:
        recordId:
          type: integer
        topic:
          $ref: '#/components/schemas/ReportTopic'
        edition:
          $ref: '#/components/schemas/ReportEdition'
    ReportInfo:
      type: object
      properties:
        id: { type: integer }
        recordId: { type: integer }
        topic: { $ref: '#/components/schemas/ReportTopic' }
        edition: { $ref: '#/components/schemas/ReportEdition' }
        status: { type: string, enum: [pending, generating, ready, failed] }
        contentVersion: { type: string }
        createdAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time, nullable: true }
    PaipanRequest:
      type: object
      required: [gender, solarDateTime, trueSolarTime]
      properties:
        name:
          type: string
        gender:
          type: string
          enum: [male, female]
        solarDateTime:
          type: string
          description: ISO 格式公历时间，如 1995-10-08T14:30:00
        birthPlace:
          type: string
          description: 出生地，用于真太阳时
        trueSolarTime:
          type: boolean
    PaipanResult:
      type: object
      properties:
        solarText:
          type: string
        lunarText:
          type: string
        shengXiao:
          type: string
        timeZhi:
          type: string
          description: 时支（如"午"）
        pillars:
          type: object
          properties:
            year: { $ref: '#/components/schemas/Pillar' }
            month: { $ref: '#/components/schemas/Pillar' }
            day: { $ref: '#/components/schemas/Pillar' }
            time: { $ref: '#/components/schemas/Pillar' }
        taiYuan:
          type: string
          description: 胎元干支（月干进一、月支进三）
        taiYuanNaYin:
          type: string
        mingGong:
          type: string
          description: 命宫干支（月支+时支反推）
        mingGongNaYin:
          type: string
        shenGong:
          type: string
          description: 身宫干支
        shenGongNaYin:
          type: string
        wuXing:
          type: object
          properties:
            jin: { type: integer }
            mu: { type: integer }
            shui: { type: integer }
            huo: { type: integer }
            tu: { type: integer }
        daYun:
          type: array
          items:
            $ref: '#/components/schemas/DaYun'
        yunStart:
          $ref: '#/components/schemas/YunStart'
        liuNianList:
          type: array
          description: 起运后逐年流年（第一步大运内 10 年）
          items:
            $ref: '#/components/schemas/LiuNianItem'
        xiaoYunList:
          type: array
          description: 起运后逐年小运（时柱起，第一步大运内 10 年）
          items:
            $ref: '#/components/schemas/XiaoYunItem'
        currentYearLiuYue:
          type: array
          description: 当前公历年份的逐月流月（节气月 12 个）
          items:
            $ref: '#/components/schemas/LiuYueItem'
        currentYearGanZhi:
          type: string
        currentLiuNian:
          $ref: '#/components/schemas/LiuNianInfo'
        trueSolar:
          $ref: '#/components/schemas/TrueSolarInfo'
    Pillar:
      type: object
      properties:
        label:
          type: string
          enum: [year, month, day, time]
        gan:
          type: string
        zhi:
          type: string
        shiShen:
          type: string
        ziZuo:
          type: string
          description: 自坐——本柱天干在本柱地支的十二长生（如"长生""帝旺"），与星运（日干为太极点）口径不同
        hideGan:
          type: array
          items:
            type: object
            properties:
              gan: { type: string }
              shiShen:
                type: string
                description: 藏干对应日主的十神（副星）
              wuxing:
                type: string
                enum: [jin, mu, shui, huo, tu]
        naYin:
          type: string
        diShi:
          type: string
        xunKong:
          type: string
        shenSha:
          type: array
          items:
            type: string
    DaYun:
      type: object
      properties:
        ageRange:
          type: string
        ganZhi:
          type: string
        yearRange:
          type: string
        isCurrent:
          type: boolean
        naYin:
          type: string
          description: 大运纳音
        xunKong:
          type: string
          description: 大运旬空
        shiShen:
          type: string
          description: 大运天干对日主的十神（前端补充）
        starFortune:
          type: string
          description: 大运星运——大运地支对日主的十二长生（与四柱星运同口径）
        shenSha:
          type: array
          items:
            type: string
    YunStart:
      type: object
      description: 起运信息（公历）
      properties:
        year:
          type: integer
        month:
          type: integer
        day:
          type: integer
        hour:
          type: integer
        forward:
          type: boolean
          description: 大运顺行（阳男阴女/阴男阳女规则）
    LiuNianItem:
      type: object
      properties:
        year:
          type: integer
        age:
          type: integer
        ganZhi:
          type: string
        naYin:
          type: string
        shiShen:
          type: string
          description: 流年天干对日主的十神（前端补充）
        starFortune:
          type: string
          description: 流年星运——流年地支对日主的十二长生
        xunKong:
          type: string
          description: 流年旬空
        liuYue:
          type: array
          description: 该流年内逐月（节气月 12 个）
          items:
            $ref: '#/components/schemas/LiuYueItem'
        shenSha:
          type: array
          items:
            type: string
          description: 流年神煞（前端补充）
    LiuYueItem:
      type: object
      properties:
        index:
          type: integer
        monthName:
          type: string
          description: 节气月名（正月/二月…）
        ganZhi:
          type: string
        naYin:
          type: string
        xunKong:
          type: string
        shiShen:
          type: string
          description: 流月天干对日主的十神（前端补充）
        shenSha:
          type: array
          items:
            type: string
          description: 流月神煞（前端补充）
    XiaoYunItem:
      type: object
      properties:
        year:
          type: integer
        age:
          type: integer
        ganZhi:
          type: string
        naYin:
          type: string
        shiShen:
          type: string
          description: 小运天干对日主的十神（前端补充）
        shenSha:
          type: array
          items:
            type: string
          description: 小运神煞（前端补充）
    LiuNianInfo:
      type: object
      properties:
        ganZhi:
          type: string
        shenSha:
          type: array
          items:
            type: string
    TrueSolarInfo:
      type: object
      properties:
        original:
          type: string
        adjusted:
          type: string
        offsetMinutes:
          type: number
        eotMinutes:
          type: number
        longitude:
          type: number
        originalShichen:
          type: string
        adjustedShichen:
          type: string
        boundaryChanged:
          type: boolean
